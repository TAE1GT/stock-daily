name: 매일 종목 발굴

on:
  schedule:
    - cron: "30 21 * * 0-4"   # 한국시간 평일(월~금) 오전 6:30
  workflow_dispatch:           # Actions 탭에서 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TZ: Asia/Seoul

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: 대시보드 생성
        env:
          AI_WORKER_URL: ${{ vars.AI_WORKER_URL }}               # Cloudflare 중계 서버 주소 (있으면 버튼 누르면 바로 분석)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # (선택) 등록하면 매일 아침 1~3위 미리 분석
        run: python stock_dashboard.py --no-open --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
