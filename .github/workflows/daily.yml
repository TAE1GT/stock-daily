name: 매일 종목 발굴

on:
  schedule:
    # GitHub 예약 실행은 아침에 2~3시간씩 밀리는 일이 많아서 새벽에 미리 출발하고, 6시 15분까지 기다렸다가 계산합니다.
    # 한국시간 평일(월~금): 03:30 · 04:30 (미리 출발) / 06:20 · 07:05 · 07:30 (예비)
    - cron: "30 18 * * 0-4"
    - cron: "30 19 * * 0-4"
    - cron: "20 21 * * 0-4"
    - cron: "5 22 * * 0-4"
    - cron: "30 22 * * 0-4"
  workflow_dispatch:           # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write              # 매일 예측 기록(history 폴더)을 저장소에 저장
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false    # 앞 회차가 돌고 있으면 끝날 때까지 기다렸다가 실행

env:
  TZ: Asia/Seoul

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240           # 새벽에 일찍 출발해 기다리는 시간 포함
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn cryptography
      - name: 미국장 마감 반영 대기 (일찍 출발한 경우 6시 15분까지)
        if: github.event_name == 'schedule'
        run: |
          now=$(date +%s); target=$(date -d "today 06:15" +%s)
          if [ "$(date +%H)" -lt 6 ] || { [ "$(date +%H)" -eq 6 ] && [ "$(date +%M)" -lt 15 ]; }; then
            echo "지금 $(date +%H:%M) → 미국장 마감 자료를 기다려 $(( (target-now)/60 ))분 뒤 시작"; sleep $((target-now))
          fi
      - name: 대시보드 생성
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}           # (선택) 등록하면 비밀번호를 아는 사람만 볼 수 있음
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}           # (선택, 무료) 국토부 실거래가 (공공데이터포털)         # (선택, 무료) 방문자 수 집계 (goatcounter.com 코드)
          DART_API_KEY: ${{ secrets.DART_API_KEY }}             # (선택, 무료) 실적·IR 공시 목록
          AI_WORKER_URL: ${{ vars.AI_WORKER_URL }}               # (선택) 버튼 누르면 바로 AI 분석
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # (선택, 유료) 매일 아침 1~3위 미리 분석
        run: python stock_dashboard.py --no-open --out site/index.html
      - name: 예측 기록 저장 (다음 날 실제 결과와 비교용)
        continue-on-error: true      # 저장이 실패해도 화면 갱신은 계속
        run: |
          git config user.name "stock-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d history ] && git add history
          git diff --cached --quiet || git commit -m "예측 기록 $(date +%Y-%m-%d_%H%M)"
          git pull --rebase --autostash || true
          git push || echo "기록 저장 실패 (다음 회차에 다시 저장됩니다)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
